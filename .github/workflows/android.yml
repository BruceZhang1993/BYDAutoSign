name: Android CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify upstream Android tools
        run: bash scripts/prepare-runtime.sh
      - name: Validate runtime scripts
        run: |
          bash -n scripts/prepare-runtime.sh
          sh -n app/src/main/assets/runtime/root-install.sh
          sh -n app/src/main/assets/runtime/byd_sign.sh
          sh -n app/src/main/assets/runtime/lib.sh
      - name: Build and test
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BYDAutoSign-debug
          path: app/build/outputs/apk/debug/*.apk
