name: Android CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate pure Kotlin protocol and scheduler implementation
        run: |
          test ! -e app/src/main/java/com/brucezhang/bydautosign/RootBridge.kt
          test ! -d app/src/main/assets/runtime
          test ! -e scripts/prepare-runtime.sh
          ! grep -R 'ProcessBuilder("su"' app/src/main/java
      - name: Run unit tests and verify APK packaging
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Inspect single APK payload (not an upload artifact)
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "assets/xposed_init" >/dev/null
          if unzip -Z1 "$APK" | grep -Eq '^(assets/runtime/|assets/bin/)'; then echo "::error::Root runtime bundled"; exit 1; fi
          # The HTTP implementation and dependency must no longer be in source.
          test ! -e app/src/main/java/xiaojw/hook/LoginHttpServer.java
          ! grep -Rq 'org.nanohttpd:nanohttpd' app/build.gradle
          sha256sum "$APK"

      # Fork PRs cannot access private signing secrets. They run tests but do
      # not create unsigned or debug artifacts masquerading as installable builds.
      - name: Prepare release signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BYD_SIGNING_KEYSTORE_BASE64: ${{ secrets.BYD_SIGNING_KEYSTORE_BASE64 }}
          BYD_SIGNING_STORE_PASSWORD: ${{ secrets.BYD_SIGNING_STORE_PASSWORD }}
          BYD_SIGNING_KEY_ALIAS: ${{ secrets.BYD_SIGNING_KEY_ALIAS }}
          BYD_SIGNING_KEY_PASSWORD: ${{ secrets.BYD_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in BYD_SIGNING_KEYSTORE_BASE64 BYD_SIGNING_STORE_PASSWORD BYD_SIGNING_KEY_ALIAS BYD_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Actions secret: $key. Configure the persistent release signing key."
              exit 1
            fi
          done
          printf '%s' "$BYD_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/byd-release.jks"
          chmod 600 "$RUNNER_TEMP/byd-release.jks"
          echo "BYD_SIGNING_STORE_FILE=$RUNNER_TEMP/byd-release.jks" >> "$GITHUB_ENV"

      - name: Build and verify signed Release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BYD_SIGNING_STORE_PASSWORD: ${{ secrets.BYD_SIGNING_STORE_PASSWORD }}
          BYD_SIGNING_KEY_ALIAS: ${{ secrets.BYD_SIGNING_KEY_ALIAS }}
          BYD_SIGNING_KEY_PASSWORD: ${{ secrets.BYD_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BYDAutoSign-release.apk

          # The artifact must be a genuinely signed and verified APK.
          APK=dist/BYDAutoSign-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -Z1 "$APK" | grep -Fx "assets/xposed_init" >/dev/null
          if unzip -Z1 "$APK" | grep -Eq '^(assets/runtime/|assets/bin/)'; then echo "::error::Root runtime bundled"; exit 1; fi
          sha256sum "$APK"

      # GitHub added direct non-zipped artifacts in upload-artifact v7
      # (archive: false); this is a raw APK in Actions Artifacts, not Releases.
      - name: Upload original signed APK (no ZIP)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          path: dist/BYDAutoSign-release.apk
          archive: false
          if-no-files-found: error
