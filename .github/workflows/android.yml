name: Android CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify upstream Android tools
        run: bash scripts/prepare-runtime.sh
      - name: Validate runtime scripts
        run: |
          bash -n scripts/prepare-runtime.sh
          sh -n app/src/main/assets/runtime/root-install.sh
          sh -n app/src/main/assets/runtime/byd_sign.sh
          sh -n app/src/main/assets/runtime/lib.sh
      - name: Validate wxcode version mappings
        run: python3 scripts/check-hook-config.py
      - name: Verify authorization/sign-only separation
        run: python3 scripts/check-sign-session.py
      - name: Build and test
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Inspect single-APK payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for item in assets/xposed_init assets/runtime/byd_sign.sh assets/runtime/lib.sh assets/runtime/root-install.sh assets/runtime/root-boot.sh assets/runtime/bin/arm64-v8a/curl assets/runtime/bin/arm64-v8a/openssl assets/runtime/bin/armeabi-v7a/curl assets/runtime/bin/armeabi-v7a/openssl; do
            unzip -Z1 "$APK" | grep -Fx "$item" >/dev/null || { echo "Missing APK asset: $item"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BYDAutoSign-debug
          path: app/build/outputs/apk/debug/*.apk
