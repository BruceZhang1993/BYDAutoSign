plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.brucezhang.bydautosign'
    compileSdk 35
    defaultConfig {
        applicationId 'com.brucezhang.bydautosign'
        minSdk 26
        // Preserve wxcode target API during stage-1 compatibility migration.
        targetSdk 34
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Use the same private signing key for every release build so Android
    // upgrades (including LSPosed module updates) retain the same certificate.
    // Credentials are supplied by GitHub Actions secrets or the local shell.
    signingConfigs {
        release {
            def signingFile = System.getenv('BYD_SIGNING_STORE_FILE')
            def signingStorePassword = System.getenv('BYD_SIGNING_STORE_PASSWORD')
            def signingKeyAlias = System.getenv('BYD_SIGNING_KEY_ALIAS')
            def signingKeyPassword = System.getenv('BYD_SIGNING_KEY_PASSWORD')
            if (signingFile && signingStorePassword && signingKeyAlias && signingKeyPassword) {
                storeFile file(signingFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        aidl true
    }
    packaging {
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }
}
tasks.register('verifySignRuntime') {
    doLast {
        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            ['curl', 'openssl'].each { tool ->
                def path = file("src/main/assets/runtime/bin/${abi}/${tool}")
                if (!path.isFile() || path.length() == 0L) {
                    throw new GradleException("Missing ${path}: run bash scripts/prepare-runtime.sh before building.")
                }
            }
        }
    }
}
tasks.named('preBuild') { dependsOn('verifySignRuntime') }

dependencies {
    // Match wxcode's Xposed API and NanoHTTPD implementation for stage-1 compatibility.
    compileOnly files('libs/api-82.jar')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
