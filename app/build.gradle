plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.brucezhang.bydautosign'
    compileSdk 35
    defaultConfig {
        applicationId 'com.brucezhang.bydautosign'
        minSdk 26
        // Preserve wxcode target API during stage-1 compatibility migration.
        targetSdk 34
        versionCode 10
        versionName '0.5.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Use the same private signing key for every release build so Android
    // upgrades (including LSPosed module updates) retain the same certificate.
    // Credentials are supplied by GitHub Actions secrets or the local shell.
    signingConfigs {
        release {
            def signingFile = System.getenv('BYD_SIGNING_STORE_FILE')
            def signingStorePassword = System.getenv('BYD_SIGNING_STORE_PASSWORD')
            def signingKeyAlias = System.getenv('BYD_SIGNING_KEY_ALIAS')
            def signingKeyPassword = System.getenv('BYD_SIGNING_KEY_PASSWORD')
            if (signingFile && signingStorePassword && signingKeyAlias && signingKeyPassword) {
                storeFile file(signingFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        aidl true
    }
    packaging {
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Hook calls the framework LSPosed API in the injected process.
    compileOnly files('libs/api-82.jar')
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
}
