# 通知配置文件
# 支持邮件通知和 Webhook 通知

# === 邮件通知配置 ===

# 启用邮件通知（true/false）
EMAIL_ENABLED="true"

# SMTP服务器
SMTP_SERVER="smtp.qq.com"
SMTP_PORT="587"

# 发件人邮箱（你的邮箱）
EMAIL_FROM=""

# 收件人邮箱（可同发件人）
EMAIL_TO=""

# SMTP授权码（不是密码！在邮箱设置中获取）
EMAIL_AUTH=""

# === Webhook 通知配置 ===

# Webhook 类型（可选：wechat/dingtalk/telegram/custom）
# wechat: 企业微信机器人
# dingtalk: 钉钉机器人
# telegram: Telegram Bot
# custom: 自定义 Webhook
WEBHOOK_TYPE=""

# Webhook URL
# 企业微信/钉钉: 输入机器人 Webhook URL
# Telegram: https://api.telegram.org/botTOKEN/sendMessage
WEBHOOK_URL=""

# 钉钉加签密钥（可选，启用加签验证时填写）
# 在钉钉机器人安全设置 → 加签中获取
DINGTALK_SECRET=""

# Telegram Chat ID（必填，Telegram 类型时必须配置）
# 发送消息给 @userinfobot 获取您的 Chat ID
TELEGRAM_CHAT_ID=""